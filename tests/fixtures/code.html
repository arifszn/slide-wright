<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Code Deck</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />
<style>
  .reveal { font-family: Arial, sans-serif; color:#EEE; }
  .reveal h2 { font-family: 'Times New Roman', serif; font-size:68px; margin:0; text-transform:none; color:#EEE; }
  .reveal .slides section { height:1080px; overflow:hidden; background:#1B1B1B; }
  .frame { position:absolute; inset:0; padding:72px 120px; box-sizing:border-box; text-align:left; display:flex; flex-direction:column; gap:40px; }
  /* code-block contract from code-slides.md */
  .reveal pre { position:relative; flex-shrink:0; width:100%; margin:0; box-shadow:none; }
  .reveal pre code.hljs { display:block; background:#12263A !important; max-height:none; padding:32px 40px; font-family:'Courier New', monospace; font-size:34px; line-height:1.5; }
</style>
</head>
<body>
<div class="reveal"><div class="slides">
  <section><div class="frame">
    <h2>One query answers it</h2>
    <pre><code data-trim data-noescape data-line-numbers="1|3-4" class="language-sql">SELECT account, count() AS alerts
FROM events
WHERE ts &gt; now() - INTERVAL 1 DAY
      AND account != 'internal'
GROUP BY account</code></pre>
  </div><aside class="notes">Step through the query.</aside></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
<script>Reveal.initialize({ width:1920, height:1080, margin:0, center:false, transition:'fade', plugins:[RevealNotes, RevealHighlight] });</script>
</body>
</html>
